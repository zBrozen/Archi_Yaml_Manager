# Publie le service des rooms (dossier worker/) sur Cloudflare Workers, avec sa base D1.
# Réglages du dépôt nécessaires (voir README, section « Rooms ») :
#   secrets   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   variable  D1_DATABASE_ID
# Génération en ligne (facultatif) :
#   secrets   ROOMS_DISPATCH_TOKEN, ROOMS_GENERATOR_SECRET
#   variable  KV_NAMESPACE_ID
name: Publier le service des rooms

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.D1_DATABASE_ID != '' }}
    env:
      GH_DISPATCH_TOKEN: ${{ secrets.ROOMS_DISPATCH_TOKEN }}
      GENERATOR_SECRET: ${{ secrets.ROOMS_GENERATOR_SECRET }}
      GENERATION: ${{ secrets.ROOMS_DISPATCH_TOKEN != '' && secrets.ROOMS_GENERATOR_SECRET != '' && vars.KV_NAMESPACE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Base D1 et stockage KV du dépôt
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          KV_NAMESPACE_ID: ${{ vars.KV_NAMESPACE_ID }}
        run: |
          sed -i "s/^database_id = .*/database_id = \"$D1_DATABASE_ID\"/" worker/wrangler.toml
          if [ -n "$KV_NAMESPACE_ID" ]; then
            sed -i "/^binding = \"FILES\"/{n;s/^id = .*/id = \"$KV_NAMESPACE_ID\"/}" worker/wrangler.toml
          else
            # Sans stockage KV, pas de génération en ligne : le bloc est retiré.
            sed -i '/^\[\[kv_namespaces\]\]/,/^id = /d' worker/wrangler.toml
          fi

      - name: Publier avec la génération en ligne
        if: env.GENERATION == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            GH_DISPATCH_TOKEN
            GENERATOR_SECRET
          command: |
            d1 migrations apply archi-rooms --remote
            deploy

      - name: Publier sans la génération en ligne
        if: env.GENERATION != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: |
            d1 migrations apply archi-rooms --remote
            deploy
