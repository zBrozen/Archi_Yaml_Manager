# Publie le service des rooms (dossier worker/) sur Cloudflare Workers, avec sa base D1.
# Réglages du dépôt nécessaires (voir README, section « Rooms ») :
#   secrets   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   variable  D1_DATABASE_ID
name: Publier le service des rooms

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.D1_DATABASE_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Base D1 du dépôt
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
        run: sed -i "s/^database_id = .*/database_id = \"$D1_DATABASE_ID\"/" worker/wrangler.toml

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: |
            d1 migrations apply archi-rooms --remote
            deploy
