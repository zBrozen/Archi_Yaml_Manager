# Met à jour les options des jeux à partir de la dernière version d'Archipelago
# et des apworlds du serveur, puis republie le site.
name: Mettre à jour les options

on:
  schedule:
    - cron: "0 5 * * *" # tous les jours à 5 h (UTC)
  workflow_dispatch:
    inputs:
      ap_version:
        description: "Version d'Archipelago (tag Git, vide = dernière release)"
        required: false
  push:
    branches: [main]
    paths:
      - "apworlds/**"
      - "apworlds.json"
      - "tools/**"
      - "translations/**"
      - ".github/workflows/update-data.yml"

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  # Recopie dans apworlds.json la liste des jeux du tableur du Discord d'Archipelago.
  # N'exécute aucun apworld : seul ce job peut écrire dans le dépôt avant l'extraction.
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.save.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recopier la liste des jeux
        run: python tools/sync_sheet.py --config apworlds.json || echo "::warning::Tableur des jeux illisible : liste inchangée"

      - name: Enregistrer la liste
        id: save
        run: |
          if ! git diff --quiet apworlds.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Jeux non officiels : liste du tableur" apworlds.json
            git push
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # Ce job exécute le code des apworlds : il n'a qu'un accès en lecture au dépôt.
  extract:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.ap.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Trouver la version d'Archipelago
        id: ap
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.ap_version }}
        run: |
          tag="$REQUESTED"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo ArchipelagoMW/Archipelago --json tagName -q .tagName)
          fi
          echo "Archipelago $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Télécharger Archipelago
        run: git clone --depth 1 --branch "${{ steps.ap.outputs.tag }}" https://github.com/ArchipelagoMW/Archipelago.git "$RUNNER_TEMP/Archipelago"

      - name: Installer les dépendances
        run: |
          AP="$RUNNER_TEMP/Archipelago"
          # Kivy ne sert qu'aux interfaces graphiques des clients.
          grep -viE '^\s*kivy' "$AP/requirements.txt" > "$RUNNER_TEMP/requirements.txt"
          pip install -r "$RUNNER_TEMP/requirements.txt" docutils requests "setuptools<81"
          for f in "$AP"/worlds/*/requirements.txt; do
            pip install -r "$f" || echo "::warning::Dépendances non installées : $f"
          done

      # Apworlds déjà téléchargés et réponses de l'API GitHub : évite de tout retélécharger
      # et de dépasser la limite de requêtes. Une nouvelle entrée est enregistrée à chaque exécution.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/apworld-cache
          key: apworlds-${{ github.run_id }}
          restore-keys: apworlds-

      - name: Ajouter les apworlds du serveur
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python tools/fetch_apworlds.py --config apworlds.json --local apworlds
          --dest "$RUNNER_TEMP/Archipelago/custom_worlds" --cache "$RUNNER_TEMP/apworld-cache"
          --credits site/data/apworld-credits.json

      - name: Extraire les options
        run: python tools/extract_options.py --ap "$RUNNER_TEMP/Archipelago" --out site/data < /dev/null

      # Archipelago pour le navigateur : lecture des apworlds déposés par les joueurs.
      - name: Construire le paquet Archipelago du site
        run: python tools/build_ap_core.py --ap "$RUNNER_TEMP/Archipelago" --out site/data/ap-core.zip

      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: site/data
          retention-days: 7

  # Traduction des descriptions en français (Argos Translate, hors ligne). Seuls les textes
  # absents de translations/fr.json sont traduits.
  translate:
    needs: extract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Récupérer les données
        run: rm -rf site/data

      - uses: actions/download-artifact@v4
        with:
          name: data
          path: site/data

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Modèle de traduction anglais → français, gardé d'une exécution à l'autre.
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-en-fr-v1

      - name: Installer Argos Translate
        run: |
          # Version de PyTorch sans GPU, bien plus légère.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install argostranslate docutils

      - name: Traduire les descriptions
        run: python tools/translate_docs.py --data site/data --cache translations/fr.json

      - uses: actions/upload-artifact@v4
        with:
          name: translated
          path: |
            site/data
            translations
          retention-days: 7

  commit:
    needs: [sync, extract, translate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.save.outputs.changed }}
    steps:
      # La branche à jour, avec la liste des jeux que le job sync vient peut-être d'enregistrer.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Récupérer les données
        run: rm -rf site/data

      - uses: actions/download-artifact@v4
        with:
          name: translated
          path: .

      - name: Enregistrer les données
        id: save
        run: |
          git add -A site/data translations
          if git diff --cached --quiet; then
            echo "Aucun changement."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Données : Archipelago ${{ needs.extract.outputs.tag }}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Un push fait par le workflow ne relance pas les autres workflows : on publie ici.
  deploy:
    needs: commit
    if: needs.commit.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
