# Publie le dossier site/ sur GitHub Pages.
name: Publier le site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # pour inclure les données que le workflow de mise à jour vient d'enregistrer

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Code des jeux officiels pour la logique des trackers (js/ut.js), à la version d'Archipelago de la
      # base : fabriqué à chaque publication plutôt que commité. Sans lui, le reste du site est publié.
      - name: Archives des jeux officiels
        continue-on-error: true
        run: |
          tag=$(python -c "import json; print(json.load(open('site/data/index.json', encoding='utf-8'))['ap_version'])")
          git clone --depth 1 --branch "$tag" https://github.com/ArchipelagoMW/Archipelago.git "$RUNNER_TEMP/Archipelago"
          python tools/build_ap_core.py --ap "$RUNNER_TEMP/Archipelago" --worlds site/data/worlds

      - uses: actions/configure-pages@v5

      # Un nom par tentative : « Re-run » garde les artefacts des tentatives précédentes du même run, et
      # deploy-pages refuse de choisir entre deux artefacts du même nom.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}

      # GitHub Pages laisse parfois un déploiement « en cours » sans jamais le terminer, alors que le même
      # artefact passe à l'essai suivant. deploy-pages n'attend pas plus de 10 min (délai plus long ignoré) et
      # annule alors le déploiement : une seconde tentative, un peu plus tard, avec le même artefact.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Attendre avant la seconde tentative
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "::warning::Premier déploiement sur GitHub Pages échoué, seconde tentative dans une minute"
          sleep 60

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
